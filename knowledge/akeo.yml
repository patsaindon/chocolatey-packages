# Facts learned about this vendor's packages while onboarding or
# updating them -- checksum field names, image-type/architecture
# defaults, version-format quirks, known-good silent-install switches.
# Read by the package-request agent before scaffolding (see
# lookup_package_knowledge) so an already-solved quirk isn't
# rediscovered by trial and error on the next package from the same
# vendor. Written only locally by write_package_knowledge -- a human
# reviews every change here in the same PR as the package it came
# from, never a silent agent write. See docs/architecture.md section 6.8.

notes: "Rufus (rufus.ie) publishes no x64 build — only ARM64 and x86 — so au_GetLatest must filter evergreen's AkeoRufus feed on Architecture=x86. No real silent-install switch exists in practice: Rufus is a single portable .exe, and the Community 'rufus.install' package actually ships/installs an .appx via Add-AppxPackage rather than running any exe silently — winget lookup was also unavailable in this environment (spawn winget ENOENT) and the ManageEngine switch catalog has no entry for it. silent_args left as the generic '/S' placeholder; a human should decide whether this package's package_kind should actually be 'portable' instead."
