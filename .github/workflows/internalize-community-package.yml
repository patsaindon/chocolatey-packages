name: Internalize Community Package
# See docs/architecture.md section 9.1 for the full workflow design.
# scan-package.ps1 is implemented (Windows Defender + Grype); the push step
# below targets a Nexus OSS nuget-format hosted repo (STAGING_FEED_URL, e.g.
# https://nexus.corp.local/repository/choco-staging/).

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "Chocolatey package ID to internalize"
        required: true
      version:
        description: "Pinned version, or 'latest'"
        required: false
        default: "latest"

jobs:
  internalize:
    runs-on: [self-hosted, windows, choco-internalize]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version to internalize
        id: resolve_version
        shell: pwsh
        run: |
          # choco's --version flag wants an actual version string; it does
          # not understand the literal word "latest" (our own manifest/input
          # convention meaning "don't pin"). Resolve the real version up
          # front via `choco search` rather than letting `choco download`
          # silently pick one — this way the run log and downstream steps
          # both know exactly what got internalized.
          $packageId = '${{ github.event.inputs.package_id }}'
          $requested = '${{ github.event.inputs.version }}'

          if ($requested -and $requested -ne 'latest') {
            $resolved = $requested
            Write-Host "Using requested version: $resolved"
          } else {
            # -r (limitoutput) prints one 'id|version' line per exact match —
            # stable/documented short flag, unlike some of choco's longer
            # option spellings which vary between hyphenated/non-hyphenated.
            $searchOutput = choco search $packageId --exact --source="https://community.chocolatey.org/api/v2/" -r
            if ($LASTEXITCODE -ne 0 -or -not $searchOutput) {
              throw "choco search found no match for '$packageId' in the Community Repository."
            }
            $resolved = (@($searchOutput)[0] -split '\|')[-1].Trim()
            if (-not $resolved) {
              throw "Could not parse a version out of choco search output: $searchOutput"
            }
            Write-Host "Resolved latest version: $resolved"
          }

          "version=$resolved" >> $env:GITHUB_OUTPUT

      - name: Internalize package
        shell: pwsh
        run: |
          choco download ${{ github.event.inputs.package_id }} `
            --internalize --source="https://community.chocolatey.org/api/v2/" `
            --internalize-all-urls `
            --version=${{ steps.resolve_version.outputs.version }} `
            --outputdirectory=.\packages\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Scan binaries
        shell: pwsh
        run: ./scripts/scan-package.ps1 -PackagePath .\packages\

      - name: Smoke test install
        shell: pwsh
        run: |
          choco install ${{ github.event.inputs.package_id }} -s .\packages\ --force -y

      - name: Push to staging feed
        shell: pwsh
        env:
          STAGING_FEED_URL: ${{ secrets.STAGING_FEED_URL }}
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          choco push .\packages\*.nupkg --source=$env:STAGING_FEED_URL --api-key=$env:STAGING_API_KEY
