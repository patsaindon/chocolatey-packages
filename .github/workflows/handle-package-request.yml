name: Handle Package Request
# Triggered by an Issue opened from .github/ISSUE_TEMPLATE/package-request.yml.
# An agent (Claude Code, headless) uses the MCP server in mcp-server/ to
# either bootstrap-internalize a Community package straight to the staging
# feed, or scaffold+PR a new internal AU package — never touching
# production, never merging its own PR. See docs/architecture.md.
#
# Runner prerequisites beyond the existing choco/git/gh/grype ones: Node.js
# (verified against v26 here), the `claude` CLI, and `winget` (used by
# get_winget_package_manifest to resolve a package name/id and its latest
# version — confirmed already present on this runner, ships with modern
# Windows), all on PATH.
#
# get_installer_signals (static MSI/EXE analysis, no execution) and its
# companion download_installer_file are both headless-safe and run here
# like every other tool. scripts/New-SilentTestKit.ps1 — the sandboxed,
# actually-runs-the-installer verification step these two only ever feed
# a candidate into — is deliberately NOT wired in here: Windows Sandbox
# opens a real interactive GUI window, which this runner (a Windows
# service account, no interactive desktop session) cannot support. It's
# a human, local, pre-merge check instead — see
# docs/silent-switch-verification.md.

on:
  issues:
    # 'labeled' in addition to 'opened': the Issue Form applies the
    # package-request label as part of the same submission when a packager
    # uses the real GitHub UI form, so 'opened' alone is normally enough —
    # but any path that creates the issue and labels it as a separate call
    # (e.g. `gh issue create --label`, or a maintainer labeling a plain
    # issue after the fact) fires 'opened' before the label is attached,
    # so the job's label check below sees an empty label list and skips.
    types: [opened, labeled]

permissions:
  contents: write        # open_pull_request pushes a branch
  pull-requests: write    # ...and opens a PR for it
  issues: write           # posting the result back as a comment

# Listening to both 'opened' and 'labeled' (above) means an issue created
# already-labeled can fire both events for the same issue — confirmed by
# testing: an `--label` issue create produced two concurrent runs for one
# request. One group per issue means the second event cancels/supersedes
# the first instead of running the agent (and potentially opening a PR,
# or pushing to staging) twice for the same request.
concurrency:
  group: package-request-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  handle-request:
    if: contains(github.event.issue.labels.*.name, 'package-request')
    runs-on: [self-hosted, windows, choco-internalize]
    steps:
      - uses: actions/checkout@v4

      - name: Install MCP server dependencies
        shell: pwsh
        run: |
          Push-Location mcp-server
          npm ci
          Pop-Location

      - name: Run the agent against the request
        id: agent
        shell: pwsh
        env:
          # CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, run once
          # interactively) authenticates against a Claude Pro/Max
          # subscription's included usage rather than pay-per-token API
          # billing — avoids needing a separately funded ANTHROPIC_API_KEY.
          # Confirmed via Claude Code's own docs, not assumed. Trade-off:
          # this ties CI usage to whoever ran setup-token; an org deploying
          # this more broadly may prefer a shared ANTHROPIC_API_KEY instead
          # (also still accepted by `claude` if set in its place).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_FEED_URL: ${{ secrets.STAGING_FEED_URL }}
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          # Passed via env, not interpolated into the script below — the
          # issue body is untrusted user input and must never be spliced
          # directly into a run: block.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          $prompt = @"
          A packager opened this GitHub issue (#$env:ISSUE_NUMBER,
          titled "$env:ISSUE_TITLE") using the "Package Request" form. Its
          body (parsed form fields as markdown):

          ---
          $env:ISSUE_BODY
          ---

          Do exactly one of the following, based on the "Package type" field:

          - "Internalized (from the Chocolatey Community Repository)": call
            search_community_package to confirm the package id exists, then
            call bootstrap_internalize_package for it (omit version to get
            latest). This pushes straight to the STAGING feed only — there
            is nothing to open a PR for, since internalized packages have no
            tracked manifest file (see internalized/README.md).

          - "Internal (AU-based ...)": before scaffolding, pick a short
            vendor slug for the software (e.g. "adoptium" for Eclipse
            Temurin) — reuse the same slug across every package you ever
            handle from this vendor — and call lookup_package_knowledge
            with it. If it already has 'silent_args' and/or 'source_url'
            recorded, you can pass this same vendor slug straight through
            to scaffold_internal_package's own 'vendor' parameter later
            and skip searching for whichever of the two is already there.
            Then call search_evergreen_app with the package name; if it
            finds a confident match, note its exact 'name' field to pass
            as scaffold_internal_package's evergreen_app_name (this makes
            scaffold_internal_package generate a real, working
            au_GetLatest instead of a generic placeholder). For whichever
            of silent_args/source_url the knowledge lookup didn't already
            have, try these in order and stop at the first confident hit
            — each is progressively less structured than the last:

            1. get_winget_package_manifest with the package name (or the
               exact winget id if you already know it) — Microsoft's own
               winget-pkgs gives a real InstallerSwitches.Silent value
               plus a real InstallerUrl/SHA256 straight from structured
               YAML, not a scrape. Multiple matches are reported as
               genuinely ambiguous, not guessed at — pass the exact id
               from the list back in if that happens and you can tell
               which one is right.
            2. get_community_package_tools with the package id (and, if
               that finds nothing and the id doesn't already end in
               '.install', you don't need to retry it yourself — it
               already tries that variant automatically) — many packages
               you're asked to make an internal AU version of (to track
               the vendor directly instead of lagging behind Community's
               own release cadence) already have a real, working
               chocolateyInstall.ps1 on Community, and its own
               detectedSilentArgs field is a reasonable source for
               silentArgs (it's a regex over a real script, not a
               guarantee — sanity-check it against the returned file text
               before trusting it).
            3. If both of those find nothing and the form's source_url
               points straight at a downloadable installer file, call
               download_installer_file with it, then
               get_installer_signals on the path it returns — an MSI's
               real Property table, or an EXE's own embedded strings
               (matched against known installer-framework fingerprints:
               NSIS, Inno Setup, InstallShield, WiX Burn, InstallAware,
               Squirrel, Advanced Installer) can surface a real
               candidate switch straight from the file itself, not a
               guess from the vendor name alone. Its CandidateSwitches
               field is a starting point for that framework, not a
               confirmed answer — say so plainly in the PR body (see
               below) rather than presenting it as settled.
            4. Only if none of the above find anything, fall back to
               search_silent_install_switch with the package name — it's
               a best-effort search of one snapshot page, so a miss
               doesn't mean no switch exists.

            Whichever step above actually produced silent_args, note it
            in the PR body: winget/get_community_package_tools results
            came from a real, working source and can be trusted as-is;
            a get_installer_signals result is only a framework-typical
            guess and should say so explicitly, recommending a human
            confirm it locally with scripts/New-SilentTestKit.ps1 (see
            docs/silent-switch-verification.md) before this package's
            switch is trusted unattended.

            Then call
            scaffold_internal_package with the package_id/owner_team/
            source_url/notes from the form, the vendor slug, plus
            whichever of evergreen_app_name/silent_args you found
            yourself this run (an explicit value always wins over the
            vendor's knowledge-base one), plus the form's "Software
            name"/"Vendor / publisher" fields as title/vendor_name if
            given (these seed the nuspec's <title>/<authors> — leave them
            out and let evergreen or the generic fallback handle it if
            the form left them blank), call lint_package on the result to
            confirm it's structurally valid. If you found a real
            silent_args or source_url this run that lookup_package_
            knowledge didn't already have for this vendor (whether from
            get_winget_package_manifest, get_community_package_tools,
            search_silent_install_switch, or your own reading of a
            script), call write_package_knowledge
            with the same vendor slug to record it — don't let a value
            you had to search for die with this one package when the next
            one from the same vendor could just reuse it. Also record any
            other vendor-level fact you learned or corrected (checksum
            field name, image-type/architecture default, version-format
            quirks). Either way, include the file write_package_knowledge
            reports writing in open_pull_request's files list alongside
            the package files — never skip this step silently if you did
            learn something, and never call write_package_knowledge just
            to restate what was already returned unchanged. Then call open_pull_request with
            all the files scaffold_internal_package (and, if applicable,
            write_package_knowledge) reported, a branch named
            package-request/<package_id>, and a PR body that says whether
            au_GetLatest was seeded from real evergreen data or is still a
            placeholder needing human research, either way noting it still
            needs human review before this package is trusted to update
            itself unattended — and, if you wrote a knowledge/ file, that
            the human reviewing this PR is also reviewing that update.

          If anything fails (package not found, lint fails, tool error),
          stop and report the failure — do not retry with guessed values.

          Your entire final response must be exactly one line, one of:
          RESULT: <short human-readable summary of what you did, including
          any PR URL or staging push confirmation>
          FAILED: <short reason>
          "@

          claude -p $prompt `
            --mcp-config mcp-server/mcp-config.json `
            --strict-mcp-config `
            --allowedTools "mcp__chocolatey-packages__search_community_package mcp__chocolatey-packages__bootstrap_internalize_package mcp__chocolatey-packages__scaffold_internal_package mcp__chocolatey-packages__lint_package mcp__chocolatey-packages__open_pull_request mcp__chocolatey-packages__search_evergreen_app mcp__chocolatey-packages__get_evergreen_app_info mcp__chocolatey-packages__search_silent_install_switch mcp__chocolatey-packages__lookup_package_knowledge mcp__chocolatey-packages__write_package_knowledge mcp__chocolatey-packages__get_community_package_tools mcp__chocolatey-packages__get_winget_package_manifest mcp__chocolatey-packages__download_installer_file mcp__chocolatey-packages__get_installer_signals" `
            --permission-mode bypassPermissions `
            --output-format json > agent_output.json

          $parsed = Get-Content agent_output.json -Raw | ConvertFrom-Json
          $resultText = $parsed.result

          Write-Host $resultText

          # Multiline-safe GITHUB_OUTPUT form — the agent was told to
          # answer in exactly one line, but nothing guarantees it always
          # will, and a plain key=value write would corrupt the output
          # file if it doesn't.
          $delimiter = "ghadelim_$([guid]::NewGuid().ToString('N'))"
          "result_text<<$delimiter" >> $env:GITHUB_OUTPUT
          $resultText >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

          if ($parsed.is_error) { exit 1 }

      - name: Comment on the issue
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Via env, not interpolated directly — this is the agent's
          # response, itself derived from untrusted issue content (possible
          # prompt injection), same reasoning as ISSUE_BODY above.
          RESULT_TEXT: ${{ steps.agent.outputs.result_text }}
        run: |
          $body = $env:RESULT_TEXT
          if (-not $body) { $body = 'The agent run failed before producing a result — check the workflow log.' }
          gh issue comment $env:ISSUE_NUMBER --body $body
