name: Handle Package Request
# Triggered by an Issue opened from .github/ISSUE_TEMPLATE/package-request.yml.
# An agent (Claude Code, headless) uses the MCP server in mcp-server/ to
# either bootstrap-internalize a Community package straight to the staging
# feed, or scaffold+PR a new internal AU package — never touching
# production, never merging its own PR. See docs/architecture.md.
#
# Runner prerequisites beyond the existing choco/git/gh/grype ones: Node.js
# (verified against v26 here) and the `claude` CLI, both on PATH.

on:
  issues:
    # 'labeled' in addition to 'opened': the Issue Form applies the
    # package-request label as part of the same submission when a packager
    # uses the real GitHub UI form, so 'opened' alone is normally enough —
    # but any path that creates the issue and labels it as a separate call
    # (e.g. `gh issue create --label`, or a maintainer labeling a plain
    # issue after the fact) fires 'opened' before the label is attached,
    # so the job's label check below sees an empty label list and skips.
    types: [opened, labeled]

permissions:
  contents: write        # open_pull_request pushes a branch
  pull-requests: write    # ...and opens a PR for it
  issues: write           # posting the result back as a comment

# Listening to both 'opened' and 'labeled' (above) means an issue created
# already-labeled can fire both events for the same issue — confirmed by
# testing: an `--label` issue create produced two concurrent runs for one
# request. One group per issue means the second event cancels/supersedes
# the first instead of running the agent (and potentially opening a PR,
# or pushing to staging) twice for the same request.
concurrency:
  group: package-request-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  handle-request:
    if: contains(github.event.issue.labels.*.name, 'package-request')
    runs-on: [self-hosted, windows, choco-internalize]
    steps:
      - uses: actions/checkout@v4

      - name: Install MCP server dependencies
        shell: pwsh
        run: |
          Push-Location mcp-server
          npm ci
          Pop-Location

      - name: Run the agent against the request
        id: agent
        shell: pwsh
        env:
          # CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, run once
          # interactively) authenticates against a Claude Pro/Max
          # subscription's included usage rather than pay-per-token API
          # billing — avoids needing a separately funded ANTHROPIC_API_KEY.
          # Confirmed via Claude Code's own docs, not assumed. Trade-off:
          # this ties CI usage to whoever ran setup-token; an org deploying
          # this more broadly may prefer a shared ANTHROPIC_API_KEY instead
          # (also still accepted by `claude` if set in its place).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_FEED_URL: ${{ secrets.STAGING_FEED_URL }}
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          # Passed via env, not interpolated into the script below — the
          # issue body is untrusted user input and must never be spliced
          # directly into a run: block.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          $prompt = @"
          A packager opened this GitHub issue (#$env:ISSUE_NUMBER,
          titled "$env:ISSUE_TITLE") using the "Package Request" form. Its
          body (parsed form fields as markdown):

          ---
          $env:ISSUE_BODY
          ---

          Do exactly one of the following, based on the "Package type" field:

          - "Internalized (from the Chocolatey Community Repository)": call
            search_community_package to confirm the package id exists, then
            call bootstrap_internalize_package for it (omit version to get
            latest). This pushes straight to the STAGING feed only — there
            is nothing to open a PR for, since internalized packages have no
            tracked manifest file (see internalized/README.md).

          - "Internal (AU-based ...)": before scaffolding, pick a short
            vendor slug for the software (e.g. "adoptium" for Eclipse
            Temurin) and call lookup_package_knowledge with it — if an
            earlier package from this vendor already recorded facts
            (checksum field name, image-type/architecture default,
            version-format quirks, a known-good silent-install switch),
            reuse them instead of rediscovering them from scratch. Then
            call search_evergreen_app with the package name; if it finds a
            confident match, note its exact 'name' field to pass as
            scaffold_internal_package's evergreen_app_name (this makes
            scaffold_internal_package generate a real, working
            au_GetLatest instead of a generic placeholder). Also call
            search_silent_install_switch with the package name — it's a
            best-effort search of one snapshot page, so a miss doesn't
            mean no switch exists — and if it finds a confident match,
            pass its silentInstallSwitch value as scaffold_internal_
            package's silent_args. Then call scaffold_internal_package
            with the package_id/owner_team/source_url/notes from the form
            plus whichever of evergreen_app_name/silent_args you found,
            call lint_package on the result to confirm it's structurally
            valid. If you learned or corrected a vendor-level fact this
            run (not already exactly what lookup_package_knowledge
            returned), call write_package_knowledge with the same vendor
            slug to record it, and include the file it reports writing in
            open_pull_request's files list alongside the package files —
            never skip this step silently if you did learn something, and
            never call write_package_knowledge just to restate what was
            already returned unchanged. Then call open_pull_request with
            all the files scaffold_internal_package (and, if applicable,
            write_package_knowledge) reported, a branch named
            package-request/<package_id>, and a PR body that says whether
            au_GetLatest was seeded from real evergreen data or is still a
            placeholder needing human research, either way noting it still
            needs human review before this package is trusted to update
            itself unattended — and, if you wrote a knowledge/ file, that
            the human reviewing this PR is also reviewing that update.

          If anything fails (package not found, lint fails, tool error),
          stop and report the failure — do not retry with guessed values.

          Your entire final response must be exactly one line, one of:
          RESULT: <short human-readable summary of what you did, including
          any PR URL or staging push confirmation>
          FAILED: <short reason>
          "@

          claude -p $prompt `
            --mcp-config mcp-server/mcp-config.json `
            --strict-mcp-config `
            --allowedTools "mcp__chocolatey-packages__search_community_package mcp__chocolatey-packages__bootstrap_internalize_package mcp__chocolatey-packages__scaffold_internal_package mcp__chocolatey-packages__lint_package mcp__chocolatey-packages__open_pull_request mcp__chocolatey-packages__search_evergreen_app mcp__chocolatey-packages__get_evergreen_app_info mcp__chocolatey-packages__search_silent_install_switch mcp__chocolatey-packages__lookup_package_knowledge mcp__chocolatey-packages__write_package_knowledge" `
            --permission-mode bypassPermissions `
            --output-format json > agent_output.json

          $parsed = Get-Content agent_output.json -Raw | ConvertFrom-Json
          $resultText = $parsed.result

          Write-Host $resultText

          # Multiline-safe GITHUB_OUTPUT form — the agent was told to
          # answer in exactly one line, but nothing guarantees it always
          # will, and a plain key=value write would corrupt the output
          # file if it doesn't.
          $delimiter = "ghadelim_$([guid]::NewGuid().ToString('N'))"
          "result_text<<$delimiter" >> $env:GITHUB_OUTPUT
          $resultText >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

          if ($parsed.is_error) { exit 1 }

      - name: Comment on the issue
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Via env, not interpolated directly — this is the agent's
          # response, itself derived from untrusted issue content (possible
          # prompt injection), same reasoning as ISSUE_BODY above.
          RESULT_TEXT: ${{ steps.agent.outputs.result_text }}
        run: |
          $body = $env:RESULT_TEXT
          if (-not $body) { $body = 'The agent run failed before producing a result — check the workflow log.' }
          gh issue comment $env:ISSUE_NUMBER --body $body
