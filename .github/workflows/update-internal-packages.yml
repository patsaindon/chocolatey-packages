name: Update Internal Packages
# AU-based update of every internal/<id>/ package — see internal/README.md
# and docs/architecture.md sections 9.3 and 15. AU itself detects a new
# version, mirrors the real vendor binary into Nexus generic storage (each
# package's own au_BeforeUpdate hook, scanning it first), and packs locally
# (Push disabled) — the resulting package already only ever references
# Nexus, so it's pushed to staging directly. Promotion to production still
# goes through the separate, environment-gated promote-package.yml.
#
# This deliberately does NOT use Chocolatey's own Package Internalizer
# (`choco download --internalize`), which an earlier version of this
# workflow did use — found by testing a real internalized package that it
# embeds a hard license check (Invoke-ValidateChocolateyLicense) requiring
# every consuming endpoint to itself hold a Chocolatey Business/MSP
# license. The Nexus-mirror approach only needs a plain HTTP GET at
# install time, no Chocolatey licensing dependency for endpoints at all.

on:
  schedule:
    - cron: "30 6 * * *"   # daily, 06:30 — after refresh-internalized-packages.yml
  workflow_dispatch: {}

jobs:
  update:
    runs-on: [self-hosted, windows, choco-internalize]
    steps:
      - uses: actions/checkout@v4

      - name: Lint every internal package
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem .\internal\ -Directory | Where-Object { $_.Name -notlike '_*' } | ForEach-Object {
            ./scripts/lint-nuspec.ps1 -PackageDir $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Update internal packages (AU — mirror to Nexus, pack only, no push)
        shell: pwsh
        env:
          NEXUS_MIRROR_BASE_URL: ${{ secrets.NEXUS_MIRROR_BASE_URL }}
          NEXUS_MIRROR_REPOSITORY: ${{ secrets.NEXUS_MIRROR_REPOSITORY }}
          NEXUS_GENERIC_WRITE_TOKEN: ${{ secrets.NEXUS_GENERIC_WRITE_TOKEN }}
        run: |
          # au_Push is intentionally NOT set to 'true' here — AU packs
          # locally (into internal/<id>/*.nupkg) but never pushes anywhere;
          # the next step pushes those already-Nexus-referencing packages
          # directly.
          #
          # update_all.ps1's own throw-on-error line is commented out by
          # default (same class of gap as test_all.ps1's $ThrowOnErrors —
          # found by testing, see docs/architecture.md section 14), so a
          # real AU update error wouldn't otherwise fail this step.
          ./update_all.ps1 -Root .\internal\
          $auErrors = $global:info | Where-Object { $_.Error } | Select-Object -ExpandProperty Error
          if ($auErrors.Count -gt 0) {
            Write-Warning "AU reported $($auErrors.Count) error(s):"
            $auErrors | ForEach-Object { Write-Warning "  - $_" }
            exit 1
          }

      - name: Push updated (Nexus-mirrored) packages to staging
        shell: pwsh
        env:
          STAGING_FEED_URL: ${{ secrets.STAGING_FEED_URL }}
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          # Each package AU just packed already references its own
          # Nexus-mirrored binary (au_BeforeUpdate, scanned before ever
          # being mirrored) rather than the vendor's live URL -- nothing
          # left to internalize, so this pushes them to staging as-is.
          $nupkgs = Get-ChildItem .\internal\ -Recurse -Filter '*.nupkg' -File |
            Where-Object { $_.DirectoryName -notlike '*\_template*' -and $_.DirectoryName -notlike '*/_template*' }
          if ($nupkgs.Count -eq 0) {
            Write-Host "No packages were packed by update_all.ps1 -- nothing to push."
            exit 0
          }

          $failed = $false
          foreach ($nupkg in $nupkgs) {
            choco push $nupkg.FullName --source=$env:STAGING_FEED_URL --api-key=$env:STAGING_API_KEY
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Push of '$($nupkg.Name)' to staging failed (exit $LASTEXITCODE)."
              $failed = $true
            } else {
              Write-Host "Pushed '$($nupkg.Name)' to staging."
            }
            # The packed nupkg is a transient local build artifact either
            # way — not something to keep around or accidentally commit.
            Remove-Item $nupkg.FullName -Force -ErrorAction SilentlyContinue
          }
          if ($failed) { exit 1 }
