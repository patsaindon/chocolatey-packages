name: Update Internal Packages
# AU-based update of every internal/<id>/ package — see internal/README.md
# and docs/architecture.md section 9.3. AU's own job is only to detect a
# new version and produce a package locally (Push disabled) — internalizing
# it (so nothing that reaches staging still depends on external network
# access) is left entirely to choco's own --internalize, run as a separate
# step against that local package, per the user's explicit direction.
# Promotion to production still goes through the separate,
# environment-gated promote-package.yml.

on:
  schedule:
    - cron: "30 6 * * *"   # daily, 06:30 — after refresh-internalized-packages.yml
  workflow_dispatch: {}

jobs:
  update:
    runs-on: [self-hosted, windows, choco-internalize]
    steps:
      - uses: actions/checkout@v4

      - name: Lint every internal package
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem .\internal\ -Directory | Where-Object { $_.Name -notlike '_*' } | ForEach-Object {
            ./scripts/lint-nuspec.ps1 -PackageDir $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Update internal packages (AU, pack only — no push)
        shell: pwsh
        run: |
          # au_Push is intentionally NOT set to 'true' here — AU packs
          # locally (into internal/<id>/*.nupkg) but never pushes anywhere.
          # The next step internalizes that local package before anything
          # reaches a shared feed.
          #
          # update_all.ps1's own throw-on-error line is commented out by
          # default (same class of gap as test_all.ps1's $ThrowOnErrors —
          # found by testing, see docs/architecture.md section 14), so a
          # real AU update error wouldn't otherwise fail this step.
          ./update_all.ps1 -Root .\internal\
          $auErrors = $global:info | Where-Object { $_.Error } | Select-Object -ExpandProperty Error
          if ($auErrors.Count -gt 0) {
            Write-Warning "AU reported $($auErrors.Count) error(s):"
            $auErrors | ForEach-Object { Write-Warning "  - $_" }
            exit 1
          }

      - name: Internalize and push updated packages
        shell: pwsh
        env:
          STAGING_FEED_URL: ${{ secrets.STAGING_FEED_URL }}
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          ./scripts/Internalize-InternalPackages.ps1 -Verbose `
            -InternalDir .\internal\ `
            -StagingRepo $env:STAGING_FEED_URL `
            -StagingApiKey $env:STAGING_API_KEY
