name: Publish Internal Package
# See docs/architecture.md section 9.3. Triggers on push/tag to internal/<id>/**;
# shares the scan/smoke-test/stage steps with the internalize workflow.

on:
  push:
    branches: [main]
    paths:
      - "internal/**"
  workflow_dispatch:
    inputs:
      package_id:
        description: "Package ID under internal/ to build"
        required: true

jobs:
  build:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Lint nuspec
        shell: pwsh
        run: ./scripts/lint-nuspec.ps1 -PackageDir .\internal\${{ github.event.inputs.package_id }}\

      - name: Pack
        shell: pwsh
        run: choco pack .\internal\${{ github.event.inputs.package_id }}\*.nuspec --outputdirectory .\packages\

      - name: Scan binaries
        shell: pwsh
        run: ./scripts/scan-package.ps1 -PackagePath .\packages\

      - name: Smoke test install
        shell: pwsh
        run: choco install ${{ github.event.inputs.package_id }} -s .\packages\ --force -y

      - name: Push to staging feed
        shell: pwsh
        env:
          STAGING_FEED_URL: ${{ secrets.STAGING_FEED_URL }}
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: choco push .\packages\*.nupkg --source=$env:STAGING_FEED_URL --api-key=$env:STAGING_API_KEY
