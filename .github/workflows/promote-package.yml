name: Promote to Production
# See docs/architecture.md section 9.4. Sweeps every package/version present
# in staging but not yet in production, re-scans it (AV + Grype, inside
# Update-ProdRepoFromTest.ps1), and pushes it on to the production feed.
# Gated by the production-feed Environment's required reviewers below —
# that approval, not anything in the script, is what keeps this from being
# an unattended auto-promote.

on:
  schedule:
    - cron: "0 8 * * *"   # daily, 08:00 — still requires environment approval
  workflow_dispatch: {}

jobs:
  promote:
    runs-on: [self-hosted, windows]
    environment: production-feed   # required reviewers configured here
    steps:
      - uses: actions/checkout@v4

      - name: Promote outdated packages from staging to production
        shell: pwsh
        env:
          STAGING_FEED_URL: ${{ secrets.STAGING_FEED_URL }}
          PRODUCTION_FEED_URL: ${{ secrets.PRODUCTION_FEED_URL }}
          # Scoped to this workflow only — never available to the
          # internalize/refresh/publish workflows. See docs/architecture.md
          # section 6.6 / 12.
          PRODUCTION_API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
        run: |
          ./scripts/Update-ProdRepoFromTest.ps1 -Verbose `
            -TestRepo $env:STAGING_FEED_URL `
            -ProdRepo $env:PRODUCTION_FEED_URL `
            -ProdRepoApiKey $env:PRODUCTION_API_KEY
