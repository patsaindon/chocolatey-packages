name: Test Internal Packages
# Validates internal/<id>/ packages on PRs touching them, before
# update-internal-packages.yml ever runs against them for real. Uses AU's
# test_all.ps1 (Force=true, Push=false — never touches any feed) to force
# an update check + pack, but only for the package(s) this PR actually
# changed -- see the "Detect changed internal packages" step below for why.
# See internal/README.md.

on:
  pull_request:
    paths:
      - "internal/**"

jobs:
  test:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need origin/<base_ref> available for the diff below

      - name: Detect changed internal packages
        id: changed
        shell: pwsh
        run: |
          $changed = git diff --name-only origin/${{ github.base_ref }}...HEAD -- internal/ |
            ForEach-Object { ($_ -split '/')[1] } | Where-Object { $_ -and $_ -notlike '_*' } | Sort-Object -Unique
          # A PR that deletes a package, or only touches internal/_template/,
          # shouldn't try to lint/test something no longer there.
          $changed = @($changed | Where-Object { Test-Path (Join-Path .\internal $_) })
          Write-Host "Changed internal packages: $(if ($changed) { $changed -join ', ' } else { '(none)' })"
          "packages=$($changed -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Lint changed internal packages
        if: steps.changed.outputs.packages != ''
        shell: pwsh
        run: |
          $failed = $false
          foreach ($id in ('${{ steps.changed.outputs.packages }}' -split ',')) {
            ./scripts/lint-nuspec.ps1 -PackageDir (Join-Path .\internal $id)
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Force-test changed internal packages (AU, no push)
        if: steps.changed.outputs.packages != ''
        shell: pwsh
        env:
          # Only used by a package whose au_GetLatest reads from a Nexus
          # generic repo (Section 6.8) -- read-only, scoped to that one
          # repository (see docs/architecture.md's note on scoping
          # anonymous read narrowly rather than granting it broadly).
          # Packages that don't use that path never reference this var.
          NEXUS_GENERIC_READ_TOKEN: ${{ secrets.NEXUS_GENERIC_READ_TOKEN }}
          # Every other internal package's own au_BeforeUpdate hook
          # (internal/_template/update.ps1, Section 15) mirrors its real
          # binary into Nexus before this force-test even packs it --
          # write-scoped to just this one repository (a dedicated
          # 'au-mirror' user, never admin or the read-only credential
          # above), so this force-test genuinely exercises the same
          # mirror-then-scan-then-repoint path production runs.
          NEXUS_MIRROR_BASE_URL: ${{ secrets.NEXUS_MIRROR_BASE_URL }}
          NEXUS_MIRROR_REPOSITORY: ${{ secrets.NEXUS_MIRROR_REPOSITORY }}
          NEXUS_GENERIC_WRITE_TOKEN: ${{ secrets.NEXUS_GENERIC_WRITE_TOKEN }}
        run: |
          # test_all.ps1 only throws (failing this step) when the caller's
          # own $ThrowOnErrors is truthy — it defaults to unset/false, so a
          # real AU update error would otherwise leave this step green.
          # Found by testing: AU genuinely errored on a package here and
          # the step still passed. That throw (an uncaught PowerShell
          # exception) is what actually fails this step -- pwsh itself
          # exits non-zero when a script-level exception propagates
          # uncaught, no separate check needed.
          #
          # The `if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }` this line
          # used to be followed by was itself a real bug, found by testing:
          # $LASTEXITCODE is a single global reflecting whichever native
          # command last ran *anywhere* in the process, however deeply
          # nested (here: Grype, invoked deep inside the Nexus-mirror
          # scan step) -- by the time control returns to this line, it can
          # be $null (not 0) even after a fully successful run, and
          # `$null -ne 0` is true in PowerShell. That silently failed this
          # step on every genuinely successful run once the mirror step
          # added a native call after which nothing else reset it, despite
          # a real, correct .nupkg already having been built -- confirmed
          # directly on the runner's own disk after a real "failed" run.
          $ThrowOnErrors = $true
          # -Name limits this run to only the package(s) this PR actually
          # changed -- previously omitted, which forced *every* internal
          # package through the full mirror+scan cycle on *every* PR
          # regardless of what it touched. Found by testing a real run:
          # MpCmdRun/Grype only need to run on genuinely new or changed
          # binaries (production's own update_all.ps1, Force=false, already
          # only reaches a package's au_BeforeUpdate when au_GetLatest
          # reports a version different from what's currently packaged --
          # this step's Force=true bypassed that same protection for every
          # unrelated package on every single PR). As the package count
          # grew today, that meant a run testing one changed package still
          # spent close to an hour serialized behind MpCmdRun scans of the
          # other ~14 that hadn't changed at all.
          $names = @('${{ steps.changed.outputs.packages }}' -split ',')
          ./test_all.ps1 -Root .\internal\ -Name $names

      - name: Show Nexus-mirror diagnostic log (if any package used it)
        # Found by testing a real CI run: AU's own output handling can lose
        # every Write-Host/'| result' message for a package whose processing
        # throws, leaving the step above with no clue why. Get-NexusMirror.ps1's
        # own file-based log (scripts/Publish-ToNexusGeneric.ps1,
        # internal/_template/update.ps1) survives that either way -- dumped
        # here unconditionally so a failure above is still diagnosable.
        if: always()
        shell: pwsh
        run: |
          $logPath = Join-Path ([System.IO.Path]::GetTempPath()) 'nexus-mirror-debug.log'
          if (Test-Path $logPath) {
            Write-Host "--- nexus-mirror-debug.log ---"
            Get-Content $logPath
          } else {
            Write-Host "No nexus-mirror-debug.log found -- no package's au_BeforeUpdate reached the mirror step this run."
          }
