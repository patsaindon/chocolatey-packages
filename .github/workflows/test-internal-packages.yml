name: Test Internal Packages
# Validates internal/<id>/ packages on PRs touching them, before
# update-internal-packages.yml ever runs against them for real. Uses AU's
# test_all.ps1 (Force=true, Push=false — never touches any feed) to force
# an update check + pack for every changed package. See internal/README.md.

on:
  pull_request:
    paths:
      - "internal/**"

jobs:
  test:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need origin/<base_ref> available for the diff below

      - name: Lint changed internal packages
        shell: pwsh
        run: |
          $failed = $false
          $changed = git diff --name-only origin/${{ github.base_ref }}...HEAD -- internal/ |
            ForEach-Object { ($_ -split '/')[1] } | Where-Object { $_ -and $_ -notlike '_*' } | Sort-Object -Unique
          foreach ($id in $changed) {
            $dir = Join-Path .\internal $id
            if (Test-Path $dir) {
              ./scripts/lint-nuspec.ps1 -PackageDir $dir
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
          }
          if ($failed) { exit 1 }

      - name: Force-test internal packages (AU, no push)
        shell: pwsh
        env:
          # Only used by a package whose au_GetLatest reads from a Nexus
          # generic repo (Section 6.8) -- read-only, scoped to that one
          # repository (see docs/architecture.md's note on scoping
          # anonymous read narrowly rather than granting it broadly).
          # Packages that don't use that path never reference this var.
          NEXUS_GENERIC_READ_TOKEN: ${{ secrets.NEXUS_GENERIC_READ_TOKEN }}
          # Every other internal package's own au_BeforeUpdate hook
          # (internal/_template/update.ps1, Section 15) mirrors its real
          # binary into Nexus before this force-test even packs it --
          # write-scoped to just this one repository (a dedicated
          # 'au-mirror' user, never admin or the read-only credential
          # above), so this force-test genuinely exercises the same
          # mirror-then-scan-then-repoint path production runs.
          NEXUS_MIRROR_BASE_URL: ${{ secrets.NEXUS_MIRROR_BASE_URL }}
          NEXUS_MIRROR_REPOSITORY: ${{ secrets.NEXUS_MIRROR_REPOSITORY }}
          NEXUS_GENERIC_WRITE_TOKEN: ${{ secrets.NEXUS_GENERIC_WRITE_TOKEN }}
        run: |
          # test_all.ps1 only throws (failing this step) when the caller's
          # own $ThrowOnErrors is truthy — it defaults to unset/false, so a
          # real AU update error would otherwise leave this step green.
          # Found by testing: AU genuinely errored on a package here and
          # the step still passed.
          $ThrowOnErrors = $true
          ./test_all.ps1 -Root .\internal\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show Nexus-mirror diagnostic log (if any package used it)
        # Found by testing a real CI run: AU's own output handling can lose
        # every Write-Host/'| result' message for a package whose processing
        # throws, leaving the step above with no clue why. Get-NexusMirror.ps1's
        # own file-based log (scripts/Publish-ToNexusGeneric.ps1,
        # internal/_template/update.ps1) survives that either way -- dumped
        # here unconditionally so a failure above is still diagnosable.
        if: always()
        shell: pwsh
        run: |
          $logPath = Join-Path ([System.IO.Path]::GetTempPath()) 'nexus-mirror-debug.log'
          if (Test-Path $logPath) {
            Write-Host "--- nexus-mirror-debug.log ---"
            Get-Content $logPath
          } else {
            Write-Host "No nexus-mirror-debug.log found -- no package's au_BeforeUpdate reached the mirror step this run."
          }
