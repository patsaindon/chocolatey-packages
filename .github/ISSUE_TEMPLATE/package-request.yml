name: Package Request
description: Request a new Chocolatey package — internalized from the Community Repository, or an internal AU-based package.
title: "[Package Request] "
labels: ["package-request"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Package type
      options:
        - Internalized (from the Chocolatey Community Repository)
        - Internal (AU-based — tracks a vendor's own release page)
        - Internal (paywalled — binary manually deposited in Nexus, see Notes)
    validations:
      required: true

  - type: input
    id: package_id
    attributes:
      label: Package id
      description: >
        For an internalized package, the exact id as it appears on
        community.chocolatey.org. For an internal package, the id you want
        to give it — this becomes the folder name and the .nuspec filename.
      placeholder: e.g. 7zip, or acme-launcher
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: Source URL (internal packages only)
      description: Where this software publishes its releases — a vendor download/releases page, an internal file share, or an artifact repo. Leave blank for internalized packages.
    validations:
      required: false

  - type: input
    id: software_name
    attributes:
      label: Software name (internal packages only)
      description: >
        The real product name, for the package's nuspec <title> — e.g.
        "Eclipse Temurin 25 (JDK)", not the package id. Leave blank to let
        the agent try evergreen-api first and fall back to a prettified
        package id otherwise.
    validations:
      required: false

  - type: input
    id: vendor_name
    attributes:
      label: Vendor / publisher (internal packages only)
      description: >
        Who actually publishes this software, for the nuspec <authors> —
        e.g. "Eclipse Adoptium", not your own team (that's "Owning team"
        below). Leave blank to let the agent try evergreen-api first and
        fall back to the owning team otherwise.
    validations:
      required: false

  - type: input
    id: owner_team
    attributes:
      label: Owning team
      description: Who should be notified if this package needs attention later.
    validations:
      required: true

  - type: input
    id: nexus_generic_base_url
    attributes:
      label: Nexus base URL (paywalled packages only)
      description: >
        Only for "Internal (paywalled)" above. You've already logged into the
        vendor's own portal, downloaded the binary yourself, and uploaded it
        to a Nexus generic/raw-format hosted repository — this automation
        never holds vendor login credentials. e.g. "https://nexus.internal".
    validations:
      required: false

  - type: input
    id: nexus_generic_repository
    attributes:
      label: Nexus generic repository name (paywalled packages only)
      description: The generic/raw-format repository name holding the upload, e.g. "generic-hosted".
    validations:
      required: false

  - type: input
    id: nexus_generic_path_prefix
    attributes:
      label: Nexus path prefix (paywalled packages only)
      description: >
        Path prefix under which you'll upload every future version's binary
        too, e.g. "acme/licensed-app/" — whenever the vendor ships an
        update, log in, download it, and upload it here again; the package
        picks up the newest one automatically from there.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else useful — why this is needed, known caveats, special install flags, etc.
    validations:
      required: false
